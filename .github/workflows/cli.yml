name: CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun's --compile cross-compiles every supported target from a single
      # host, so we don't need a build matrix - one ubuntu-latest job produces
      # all five binaries.
      - name: Build CLI binaries
        working-directory: cli
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-linux-x64    --outfile dist/sirene-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64  --outfile dist/sirene-linux-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64   --outfile dist/sirene-darwin-x64
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/sirene-darwin-arm64
          bun build src/index.ts --compile --target=bun-windows-x64  --outfile dist/sirene-windows-x64.exe

      - name: Generate checksums
        working-directory: cli/dist
        run: sha256sum sirene-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/dist/sirene-*
            cli/dist/SHA256SUMS.txt
          generate_release_notes: true

  update-flake:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Compute per-platform CLI hashes
        id: hashes
        run: |
          VERSION=${GITHUB_REF_NAME#cli-v}
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          declare -A ASSETS=(
            [x86_64-linux]=sirene-linux-x64
            [aarch64-linux]=sirene-linux-arm64
            [x86_64-darwin]=sirene-darwin-x64
            [aarch64-darwin]=sirene-darwin-arm64
          )
          for sys in "${!ASSETS[@]}"; do
            asset="${ASSETS[$sys]}"
            wget -q "$BASE/$asset" -O "$asset"
            hash=$(nix hash file --sri --type sha256 "$asset")
            echo "${sys}=${hash}" >> "$GITHUB_OUTPUT"
            echo "$sys → $hash"
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix
        run: |
          # Match on the system key so we don't touch the desktop hash (its
          # line has a different shape: `hash = "sha256-..."` vs ours which is
          # `"<system>" = "sha256-..."`).
          sed -i 's|cliVersion = "[^"]*";|cliVersion = "${{ steps.hashes.outputs.version }}";|' flake.nix
          sed -i 's|"x86_64-linux"[[:space:]]*=[[:space:]]*"sha256-[^"]*";|"x86_64-linux"   = "${{ steps.hashes.outputs.x86_64-linux }}";|' flake.nix
          sed -i 's|"aarch64-linux"[[:space:]]*=[[:space:]]*"sha256-[^"]*";|"aarch64-linux"  = "${{ steps.hashes.outputs.aarch64-linux }}";|' flake.nix
          sed -i 's|"x86_64-darwin"[[:space:]]*=[[:space:]]*"sha256-[^"]*";|"x86_64-darwin"  = "${{ steps.hashes.outputs.x86_64-darwin }}";|' flake.nix
          sed -i 's|"aarch64-darwin"[[:space:]]*=[[:space:]]*"sha256-[^"]*";|"aarch64-darwin" = "${{ steps.hashes.outputs.aarch64-darwin }}";|' flake.nix

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already up to date"
          else
            git commit -m "chore: update flake.nix for ${{ github.ref_name }}"
            git push
          fi
