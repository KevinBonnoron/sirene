name: Release

# Everything that publishes, and nothing that checks. The checks are the CI
# workflow, and the branch ruleset is what makes them binding: nothing reaches
# main without passing them, so rechecking here would only reconfirm a known
# result. A push to main publishes the Docker images and the docs; a tag also
# ships the CLI and desktop builds as a GitHub release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BUN_VERSION: 1.3.10

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The ruleset guards the main branch, and a tag is not a branch: anything can
  # be tagged, including a commit that never passed a check. Asking whether the
  # revision reached main is what says it was checked.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refuse a revision that never reached main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main; only what reached main may be released"; exit 1; }

  docker:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # /api/version reports this; a tag v1.2.3 becomes 1.2.3, a push to main
      # the short commit, matching what the desktop build embeds.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # Heavy image, rebuilt on main only when its inputs changed; a tag or a
  # manual dispatch always rebuilds it.
  docker-inference:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: cpu
            tag: latest
          - variant: cuda
            tag: cuda
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            inference:
              - 'inference/**'
              - 'docker/Dockerfile.inference'
      - id: gate
        run: echo "build=${{ steps.changes.outputs.inference == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sirene-inference
          tags: |
            type=raw,value=${{ matrix.tag }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=sha,suffix=-${{ matrix.variant }}
      - if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile.inference
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: INFERENCE_VARIANT=${{ matrix.variant }}
          cache-from: type=gha,scope=inference-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=inference-${{ matrix.variant }}

  docs:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run -F @sirene/docs build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Everything below only runs for a tag: it is what becomes the GitHub release.

  # Bun cross-compiles every target from one host, so a single job produces all
  # five binaries.
  cli:
    needs: guard
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build CLI binaries
        working-directory: cli
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-linux-x64    --outfile dist/sirene-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64  --outfile dist/sirene-linux-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64   --outfile dist/sirene-darwin-x64
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/sirene-darwin-arm64
          bun build src/index.ts --compile --target=bun-windows-x64  --outfile dist/sirene-windows-x64.exe
          cd dist && sha256sum sirene-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: cli/dist/

  client:
    needs: guard
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run -F @sirene/client build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: client/dist/

  desktop:
    needs: client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install GTK and WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Only the Windows resource file (icon, manifest) needs the wails3 CLI.
      - name: Install wails3 CLI
        if: runner.os == 'Windows'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.21
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-dist
          path: server/ui/dist/
      - name: Package
        shell: bash
        run: task desktop:package VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/bin/*.tar.gz
            desktop/bin/*.zip

  release:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{cli-dist,desktop-*}'
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true

  # The flake fetches release assets by hash, so every release rewrites them.
  update-flake:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Recompute hashes and bump flake.nix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          declare -A CLI_ASSETS=(
            [x86_64-linux]=sirene-linux-x64
            [aarch64-linux]=sirene-linux-arm64
            [x86_64-darwin]=sirene-darwin-x64
            [aarch64-darwin]=sirene-darwin-arm64
          )
          for sys in "${!CLI_ASSETS[@]}"; do
            asset="${CLI_ASSETS[$sys]}"
            wget -q "$BASE/$asset" -O "$asset"
            hash=$(nix hash file --sri --type sha256 "$asset")
            sed -i "s|\"${sys}\"[[:space:]]*=[[:space:]]*\"sha256-[^\"]*\";|\"${sys}\" = \"${hash}\";|" flake.nix
          done

          wget -q "$BASE/sirene-desktop-linux-amd64.tar.gz" -O desktop.tar.gz
          DESKTOP_HASH=$(nix hash file --sri --type sha256 desktop.tar.gz)

          sed -i "s|version = \"[^\"]*\";|version = \"${VERSION}\";|" flake.nix
          sed -i "s|hash = \"sha256-[^\"]*\";|hash = \"${DESKTOP_HASH}\";|" flake.nix
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already up to date"
          else
            git commit -m "chore: update flake.nix for ${GITHUB_REF_NAME}"
            git push
          fi
