name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Bun's --compile cross-compiles every supported target from a single
      # host, so we don't need a build matrix - one ubuntu-latest job produces
      # all five binaries.
      - name: Build CLI binaries
        working-directory: cli
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-linux-x64    --outfile dist/sirene-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64  --outfile dist/sirene-linux-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64   --outfile dist/sirene-darwin-x64
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/sirene-darwin-arm64
          bun build src/index.ts --compile --target=bun-windows-x64  --outfile dist/sirene-windows-x64.exe
          cd dist && sha256sum sirene-* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build client
        run: bun run -F @sirene/client build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  package-desktop:
    needs: build-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails3 CLI (Windows resources)
        if: runner.os == 'Windows'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.21

      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: server/ui/dist/

      - name: Package desktop
        shell: bash
        run: task desktop:package VERSION=${GITHUB_REF_NAME#v}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/bin/*.tar.gz
            desktop/bin/*.zip

  release:
    needs: [build-cli, package-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  update-flake:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: cachix/install-nix-action@v27

      - name: Recompute hashes and bump flake.nix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          declare -A CLI_ASSETS=(
            [x86_64-linux]=sirene-linux-x64
            [aarch64-linux]=sirene-linux-arm64
            [x86_64-darwin]=sirene-darwin-x64
            [aarch64-darwin]=sirene-darwin-arm64
          )
          for sys in "${!CLI_ASSETS[@]}"; do
            asset="${CLI_ASSETS[$sys]}"
            wget -q "$BASE/$asset" -O "$asset"
            hash=$(nix hash file --sri --type sha256 "$asset")
            sed -i "s|\"${sys}\"[[:space:]]*=[[:space:]]*\"sha256-[^\"]*\";|\"${sys}\" = \"${hash}\";|" flake.nix
          done

          wget -q "$BASE/sirene-desktop-linux-amd64.tar.gz" -O desktop.tar.gz
          DESKTOP_HASH=$(nix hash file --sri --type sha256 desktop.tar.gz)

          sed -i "s|version = \"[^\"]*\";|version = \"${VERSION}\";|" flake.nix
          sed -i "s|hash = \"sha256-[^\"]*\";|hash = \"${DESKTOP_HASH}\";|" flake.nix

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already up to date"
          else
            git commit -m "chore: update flake.nix for ${GITHUB_REF_NAME}"
            git push
          fi
