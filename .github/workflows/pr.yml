name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client
        run: bun run -F @sirene/client build

      - name: Build CLI
        run: bun run -F @sirene/cli build

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK/WebKit headers (desktop build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check formatting
        run: test -z "$(gofmt -l server desktop)"

      - name: Vet
        run: go vet -tags gtk3 ./...

      - name: Test
        run: go test -tags gtk3 ./...

      - name: Build server
        run: go build ./server/cmd/sirene

      - name: Build desktop
        run: |
          mkdir -p desktop/internal/launcher/inference_src
          cp -r inference/src desktop/internal/launcher/inference_src/src
          cp inference/pyproject.toml inference/overrides.txt desktop/internal/launcher/inference_src/
          CGO_ENABLED=1 go build -tags gtk3 ./desktop

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx biome ci .
